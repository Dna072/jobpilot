name: deploy-gcp
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        default: latest
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Auth to Google Cloud
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Setup Terraform
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: hashicorp/setup-terraform@v3
      - name: Deploy
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: europe-north1
          IMAGE_TAG: ${{ github.event.inputs.tag }}
          TF_AUTO_APPROVE: -auto-approve
        run: ./scripts/gcp-deploy.sh
      - name: Skip when GCP auth is not configured
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        run: echo "Set GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, and GCP_PROJECT_ID to enable this workflow."
