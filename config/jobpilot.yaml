scout:
  max_jobs_per_source: 100
  # LinkedIn and Indeed have no public job-search API. Scraping them is forbidden.
  # Swedish Platsbanken (JobTech) and ATS boards cover most of the same ads.
  sources:
    jobtech:
      enabled: true
      queries:
        - data engineer
        - analytics engineer
        - backend engineer
        - backend developer
        - frontend engineer
        - frontend developer
        - platform engineer
        - software engineer
        - python developer
    arbeitnow:
      enabled: true
    greenhouse:
      enabled: true
      boards:
        - spotify
        - klarna
        - king
        - mojang
        - volvo
        - polestar
        - iizuke
        - epidemicsound
        - truecaller
        - trustly
        - mentimeter
        - einride
    lever:
      enabled: true
      companies:
        - tretton37
    remotive:
      enabled: true
    adzuna:
      enabled: false
      countries: [se, de, nl, dk, no, fi, at, be, ch]
  polite_delay_seconds: 1.0

