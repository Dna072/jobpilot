[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Autonomous AI job-search, portfolio engineering, and application system"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Derrick Adjei" }]
dependencies = [
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "orjson>=3.10",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0",
  "redis>=5.1",
  "rich>=13.8",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]
llm = [
  "openai>=1.50",
]
browser = [
  "playwright>=1.48",
]

[project.scripts]
jobpilot = "jobpilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP042"]
